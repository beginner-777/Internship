<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08090d" />
    <meta name="description" content="Musfirah Shakeel — Frontend AI Engineer crafting responsive, intelligent web experiences." />
    <meta property="og:title" content="Musfirah.OS — Frontend AI Engineer" />
    <meta property="og:description" content="An intelligent portfolio workspace by Musfirah Shakeel." />
    <title>Musfirah.OS — Frontend AI Engineer</title>
    <script>
      try {
        const savedTheme = localStorage.getItem('musfirah-os-theme');
        document.documentElement.dataset.theme = savedTheme || 'dark';
      } catch {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <style>
      html, body, #root { min-height: 100%; margin: 0; background: #050608; color: #f5f7fa; }
      .preflight-shell { min-height: 100vh; display: grid; place-items: center; overflow: hidden; background: radial-gradient(circle at 50% 45%, rgba(137,220,232,.08), transparent 28%), #050608; font-family: system-ui, sans-serif; }
      .preflight-core { position: relative; width: 76px; aspect-ratio: 1; border: 1px solid rgba(137,220,232,.25); border-radius: 50%; animation: preflight-spin 2.2s linear infinite; }
      .preflight-core::before { content: ''; position: absolute; inset: 17px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #89dce8 15%, #6b5cb7 62%, #11141a); box-shadow: 0 0 35px rgba(137,220,232,.3); }
      .preflight-core::after { content: 'INITIALIZING M/AI.OS'; position: absolute; top: 98px; left: 50%; width: 220px; transform: translateX(-50%); color: #737b88; font-size: 9px; letter-spacing: .16em; text-align: center; }
      @keyframes preflight-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="preflight-shell" aria-label="Initializing portfolio">
        <div class="preflight-core"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
